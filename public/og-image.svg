<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508"/>
      <stop offset="50%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#050508"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="lime-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#84cc16"/>
      <stop offset="100%" style="stop-color:#a3e635"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#6366f1" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#6366f1" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#6366f1" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#6366f1" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#6366f1" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#6366f1" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#6366f1" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#6366f1" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#6366f1" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#6366f1" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#6366f1" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#6366f1" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#6366f1" stroke-width="1"/>
  </g>
  
  <!-- Box cursor icon -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="none" stroke="url(#lime-gradient)" stroke-width="4"/>
    <rect x="60" y="-20" width="40" height="12" rx="2" fill="url(#lime-gradient)" transform="rotate(45, 60, -20)"/>
  </g>
  
  <!-- Main text -->
  <text x="200" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="url(#text-gradient)">ecremmoce</text>
  
  <!-- Tagline -->
  <text x="200" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#9ca3af">글로벌 이커머스 올인원 솔루션</text>
  
  <!-- Services -->
  <g transform="translate(200, 400)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#10b98120" stroke="#10b981" stroke-width="1"/>
    <text x="90" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#10b981" text-anchor="middle">acsell.ai</text>
    
    <rect x="200" y="0" width="180" height="40" rx="20" fill="#f59e0b20" stroke="#f59e0b" stroke-width="1"/>
    <text x="290" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle">send4u.ai</text>
    
    <rect x="400" y="0" width="200" height="40" rx="20" fill="#ec489920" stroke="#ec4899" stroke-width="1"/>
    <text x="500" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#ec4899" text-anchor="middle">ohmyorder.com</text>
    
    <rect x="620" y="0" width="180" height="40" rx="20" fill="#06b6d420" stroke="#06b6d4" stroke-width="1"/>
    <text x="710" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#06b6d4" text-anchor="middle">market4u.ai</text>
  </g>
  
  <!-- Slogan -->
  <text x="200" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#6b7280">전 세계가 당신의 마켓입니다</text>
  
  <!-- URL -->
  <text x="1100" y="580" font-family="system-ui, sans-serif" font-size="18" fill="#4b5563" text-anchor="end">www.ecremmoce.io</text>
</svg>

