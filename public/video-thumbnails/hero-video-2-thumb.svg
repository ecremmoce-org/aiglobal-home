<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="text-gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="50%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="play-gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-gradient2)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.06">
    <pattern id="grid2" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ec4899" stroke-width="1"/>
    </pattern>
    <rect width="1280" height="720" fill="url(#grid2)"/>
  </g>
  
  <!-- Glow effect -->
  <ellipse cx="640" cy="360" rx="350" ry="250" fill="#ec4899" opacity="0.08" filter="blur(80px)"/>
  
  <!-- Main text Korean -->
  <text x="640" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">연결이</text>
  <text x="640" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="bold" fill="url(#text-gradient2)" text-anchor="middle">혁신으로</text>
  <text x="640" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">만들어집니다</text>
  
  <!-- Play button -->
  <g transform="translate(640, 560)">
    <circle cx="0" cy="0" r="45" fill="url(#play-gradient2)" opacity="0.9"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.5"/>
    <polygon points="12,-16 12,16 -8,0" fill="white" transform="translate(-3, 0)"/>
  </g>
  
  <!-- Subtitle -->
  <text x="640" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">ecremmoce - 글로벌 이커머스 올인원 솔루션</text>
  
  <!-- URL -->
  <text x="640" y="690" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">www.ecremmoce.io</text>
</svg>

