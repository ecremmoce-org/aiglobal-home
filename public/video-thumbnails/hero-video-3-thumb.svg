<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a09"/>
      <stop offset="50%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#0c0a09"/>
    </linearGradient>
    <linearGradient id="text-gradient3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <linearGradient id="play-gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-gradient3)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05">
    <pattern id="grid3" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#a78bfa" stroke-width="1"/>
    </pattern>
    <rect width="1280" height="720" fill="url(#grid3)"/>
  </g>
  
  <!-- Glow effect -->
  <ellipse cx="640" cy="360" rx="400" ry="280" fill="#a78bfa" opacity="0.1" filter="blur(100px)"/>
  
  <!-- Main text Korean -->
  <text x="640" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">전 세계가</text>
  <text x="640" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="90" font-weight="bold" fill="url(#text-gradient3)" text-anchor="middle">당신의</text>
  <text x="640" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">마켓입니다</text>
  
  <!-- Play button -->
  <g transform="translate(640, 570)">
    <circle cx="0" cy="0" r="48" fill="url(#play-gradient3)" opacity="0.9"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>
    <polygon points="14,-18 14,18 -9,0" fill="white" transform="translate(-4, 0)"/>
  </g>
  
  <!-- Subtitle -->
  <text x="640" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a8a29e" text-anchor="middle">ecremmoce - All-in-One Global E-commerce Suite</text>
  
  <!-- URL -->
  <text x="640" y="695" font-family="system-ui, sans-serif" font-size="14" fill="#78716c" text-anchor="middle">www.ecremmoce.io</text>
</svg>

